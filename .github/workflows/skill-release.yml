name: Build Skill ZIP

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to build (e.g. v0.1.2)"
        required: true

permissions:
  contents: read

concurrency:
  group: skill-release-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and attach skill zip
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Determine version
        id: version
        run: |
          TAG="${{ inputs.tag || github.event.release.tag_name }}"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Zip skill
        run: |
          cd skills
          zip -r "../wsws-md-skill-${{ steps.version.outputs.version }}.zip" wsws-md

      - uses: actions/upload-artifact@v4
        with:
          name: wsws-md-skill-${{ steps.version.outputs.version }}
          path: wsws-md-skill-${{ steps.version.outputs.version }}.zip

      - name: Attach zip to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "wsws-md-skill-${{ steps.version.outputs.version }}.zip"
