[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wsws-md"
version = "0.1.2"
description = "Convert World Socialist Web Site articles to Markdown"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
    "beautifulsoup4>=4.12",
    "markdownify>=0.13",
    "lxml>=4.9",
]

[project.scripts]
wswsmd = "wswsmd.cli:main"

[project.optional-dependencies]
test = ["pytest>=7.0", "pytest-cov>=5.0"]
dev = [
    "wsws-md[test]",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-requests",
    "types-beautifulsoup4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--cov=wswsmd --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
source = ["src/wswsmd"]

[tool.ruff]
target-version = "py310"
src = ["src", "tests"]

[tool.mypy]
python_version = "3.10"
packages = ["wswsmd"]
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "wswsmd.parse"
disable_error_code = ["union-attr", "index", "call-arg", "return-value"]
